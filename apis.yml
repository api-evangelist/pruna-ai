aid: pruna-ai
name: Pruna AI
description: >-
  Pruna AI builds Performance Models (P-Series) — optimized image and video
  generation models engineered to be faster, cheaper, and smaller than standard
  alternatives while keeping quality high. It ships three ways: a hosted HTTP
  API (P-API) that exposes ~20 models (text-to-image, image editing, upscaling,
  virtual try-on, text/image-to-video, avatar, animation and replacement, plus
  LoRA trainers) behind a single endpoint selected via a request header; an
  open-source Python optimization framework (pruna / pruna-pro) for caching,
  quantization, pruning, distillation and compilation of your own models; and
  hosted demos. The P-API uses apikey-header auth with an async
  submit/poll/download workflow and an optional synchronous mode. Pruna AI is a
  portfolio company of EQT Ventures.
