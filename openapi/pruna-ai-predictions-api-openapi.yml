          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/predictions/status/{id}:
    get:
      summary: Get prediction status
      description: 'Check the status of a prediction request. This is the second step

        in the asynchronous workflow.


        When the prediction is completed successfully, the response will include download

        URLs for the generated content (images or videos).


        Rate limit: 30,000 requests per minute.

        '
      operationId: getPredictionStatus
      tags:
      - Predictions
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: The prediction ID returned from the initial request
        schema:
          type: string
          example: 1knpbkf075rme0csjqr987hg4w
      responses:
        '200':
          description: Prediction status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionStatusResponse'
              examples:
                processing:
                  summary: Prediction in progress
                  value:
                    status: processing
                    message: Generation in progress
                starting:
                  summary: Prediction starting
                  value:
                    status: starting
                    message: Generation in progress
                completed:
                  summary: Prediction completed successfully
                  value:
                    status: succeeded
                    generation_url: https://api.pruna.ai/v1/predictions/delivery/xezq/52UGYRrRfqViaKmvYsEnENTh0qLDAWHptQ8jOnEHu7XC6AtKA/output.mp4
                canceled:
                  summary: Prediction was canceled
                  value:
                    status: canceled
                    message: Prediction was canceled
                failed:
                  summary: Prediction failed during processing
                  value:
                    status: failed
                    message: Prediction failed
                    error: Number of samples, -5, must be non-negative.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    ValidationError:
      description: Request validation failed - invalid input parameters
      content:
        application/json:
          schema:
            type: object
            required:
            - detail
            - status
            - title
            properties:
              detail:
                type: string
                description: Human-readable error summary
                example: '- input.num_inference_steps: Invalid type. Expected: integer, given: string

                  '
              status:
                type: integer
                description: HTTP status code
                example: 422
              title:
                type: string
                description: Error title
                example: Input validation failed
              invalid_fields:
                type: array
                description: List of field-specific validation errors
                items:
                  type: object
                  required:
                  - type
                  - field
                  - description
                  properties:
                    type:
                      type: string
                      description: Type of validation error
                      example: invalid_type
                    field:
                      type: string
                      description: Field path that failed validation
                      example: input.num_inference_steps
                    description:
                      type: string
                      description: Error description
                      example: 'Invalid type. Expected: integer, given: string'
          examples:
            type_error:
              summary: Invalid parameter type
              value:
                detail: '- input.num_inference_steps: Invalid type. Expected: integer, given: string

                  '
                status: 422
                title: Input validation failed
                invalid_fields:
                - type: invalid_type
                  field: input.num_inference_steps
                  description: 'Invalid type. Expected: integer, given: string'
            missing_field:
              summary: Required field missing
              value:
                detail: '- input.prompt: Field required

                  '
                status: 422
                title: Input validation failed
                invalid_fields:
                - type: missing
                  field: input.prompt
                  description: Field required
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: The requested resource was not found
              details: Prediction ID does not exist or has expired
            request_id: req_1234567890
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred
              details: Please try again later or contact support if the problem persists
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: AUTHENTICATION_FAILED
              message: Invalid or missing API key
              details: Include your API key in the 'apikey' header
            request_id: req_1234567890
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request parameters
              details: Field 'model' is required
            request_id: req_1234567890
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            details:
              type: string
              description: Additional error context
        request_id:
          type: string
          description: Unique request identifier for debugging
          example: req_1234567890
    PredictionResponse:
      type: object
      required:
      - id
      - model
      - input
      - get_url
      properties:
        id:
          type: string
          description: Unique identifier for the prediction
          example: 1zww7deyssrme0csqwr90phzzr
        model:
          type: string
          description: Model identifier used for this prediction
          example: vace
        input:
          type: object
          description: The input parameters provided for this prediction
          additionalProperties: true
        get_url:
          type: string
          format: uri
          description: URL to check prediction status
          example: https://api.pruna.ai/v1/predictions/status/1zww7deyssrme0csqwr90phzzr
    PredictionStatusResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: Current status of the prediction
          enum:
          - starting
          - processing
          - succeeded
          - failed
          - canceled
          example: processing
        generation_url:
          type: string
          description: URL to download the generated content (available when status is 'succeeded')
          example: https://api.pruna.ai/v1/predictions/delivery/xezq/52UGYRrRfqViaKmvYsEnENTh0qLDAWHptQ8jOnEHu7XC6AtKA/output.mp4
        message:
          type: string
          description: Status message
          example: Generation in progress
        error:
          type: string
          description: Error details (available when status is 'failed')
          example: Number of samples, -5, must be non-negative.
    PredictionRequest:
      type: object
      required:
      - input
      properties:
        input:
          type: object
          description: Model-specific input parameters
          additionalProperties: true
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: 'API key for authentication. You can obtain your API key from the

        Pruna AI dashboard.


        Include it in the `apikey` header for all requests.

        '
externalDocs:
  description: Model Documentation
  url: https://docs.api.pruna.ai
