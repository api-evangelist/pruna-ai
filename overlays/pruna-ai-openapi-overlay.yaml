overlay: 1.0.0
info:
  title: API Evangelist enhancements for Pruna P-API
  version: 1.0.0
extends: openapi/pruna-ai-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-enrichment:
        method: searched
        source: https://docs.api.pruna.ai/
        auth: api-key (apikey header)
        workflow: async submit/poll/download + optional Try-Sync sync mode
        conventions: conventions/pruna-ai-conventions.yml
        errors: errors/pruna-ai-problem-types.yml
        rate_limits: rate-limits/pruna-ai-rate-limits.yml
  - target: $.paths['/v1/predictions'].post
    update:
      x-apievangelist-notes: >-
        Target model is chosen via the Model request header; set Try-Sync: true
        to block up to 60s for the result instead of polling.
  - target: $.paths['/v1/files'].post
    update:
      x-apievangelist-notes: >-
        multipart/form-data upload; returned get URL is passed into
        PredictionRequest.input.images[]. Files carry expires_at.
